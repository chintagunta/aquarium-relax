  <body>
    <div id="root"></div>
    <script>
      // A tiny in-page self-check. It records anything that throws while the
      // reef is starting up and exposes the canvas size as attributes, so a
      // smoke test (or a curious developer) can read the tank's state without
      // a debugger attached. Costs a few bytes and no layout.
      (function () {
        var errors = [];
        window.__REEF_ERRORS__ = errors;
        function probe() {
          var el = document.getElementById('reef-probe');
          if (!el) {
            el = document.createElement('div');
            el.id = 'reef-probe';
            el.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;overflow:hidden';
            document.body.appendChild(el);
          }
          var canvas = document.querySelector('canvas');
          el.setAttribute('data-errors', String(errors.length));
          el.setAttribute('data-error-text', errors.slice(0, 3).join(' | ').slice(0, 400));
          el.setAttribute('data-canvas', canvas ? canvas.width + 'x' + canvas.height : 'none');
          el.textContent = 'errors=' + errors.length;
        }
        window.addEventListener('error', function (e) {
          errors.push(String((e && (e.message || e.error)) || e));
          probe();
        });
        window.addEventListener('unhandledrejection', function (e) {
          errors.push('promise: ' + String(e.reason));
          probe();
        });
        window.__reefProbe = probe;
        setTimeout(probe, 400);
        setTimeout(probe, 1600);
      })();
    </script>
